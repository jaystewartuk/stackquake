# CI and automatic deploys (docs/DECISIONS.md "Automatic deploys").
# Every push and PR: typecheck and tests. A push to main then deploys staging (migrations, deploy,
# /health) and, only if that passed, production the same way. Deploys never run in parallel.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: CLOUDFLARE_ACCOUNT_ID_PLACEHOLDER

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:catalog

      - name: Staging
        run: npm run db:migrate:staging && npx wrangler deploy --env staging
      - name: Staging health
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://staging.stackquake.com/health

      - name: Production
        run: npm run db:migrate:production && npx wrangler deploy --env=""
      - name: Production health
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://stackquake.com/health
