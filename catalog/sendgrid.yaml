id: sendgrid
name: SendGrid
category: email
aliases: [twilio sendgrid, sendgrid email]
detect:
  npm: ["@sendgrid/mail", "@sendgrid/client"]
  pypi: [sendgrid]
sources:
  # sendgrid.com/pricing redirects to a Twilio landing page, and the Email API product page
  # (https://www.twilio.com/en-us/products/email-api) was dropped for CPU (Workers Free plan):
  # about 48 ms per poll. The billing docs page answers Markdown.
  - kind: page
    url: https://www.twilio.com/docs/sendgrid/ui/account-and-settings/billing
    selector: main
  - kind: npm
    package: "@sendgrid/mail"
  - kind: pypi
    package: sendgrid
  - kind: github_repo
    repo: sendgrid/sendgrid-nodejs
alternatives: [resend, twilio]
usage_questions: [hosted, commercial, tier]
single_vendor: true
